name: Release

on:
  push:
    branches:
      - sgc
    tags:
      - 'dex-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., dex-v0.0.1)'
        required: true
        default: 'dex-v0.0.1'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            ext: tar.gz
            platform: linux
            artifact: dex-linux-x64
          - os: linux
            arch: arm64
            ext: tar.gz
            platform: linux
            artifact: dex-linux-arm64

    runs-on: ${{ matrix.os == 'darwin' && 'macos-latest' || (matrix.os == 'win32' && 'windows-latest' || 'ubuntu-latest') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: sgc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install

      - name: Build dex
        env:
          DEX_NAME: dex
          DEX_VERSION: ${{ github.ref_name }}
        run: |
          bun run --cwd packages/opencode script/build-dex.ts --single

      - name: Package binary
        run: |
          mkdir -p release
          tar -czf release/${{ matrix.artifact }}.tar.gz -C packages/opencode/dist/${{ matrix.artifact }}/bin .

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/${{ matrix.artifact }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-latest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: sgc
          sparse-checkout: |
            packages/opencode/script/build.ts

      - name: Generate latest.json
        run: |
          VERSION=${{ github.ref_name }}
          cat > latest.json << 'EOF'
          {
            "version": "$VERSION",
            "platforms": [
              {
                "name": "dex-linux-x64",
                "url": "https://github.com/P3X-118/opencode/releases/download/$VERSION/dex-linux-x64.tar.gz"
              },
              {
                "name": "dex-linux-arm64",
                "url": "https://github.com/P3X-118/opencode/releases/download/$VERSION/dex-linux-arm64.tar.gz"
              }
            ]
          }
          EOF

      - name: Upload latest.json
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs: [build, update-latest]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify completion
        run: |
          echo "Dex release ${{ github.ref_name }} completed!"
          echo "View at: https://github.com/P3X-118/opencode/releases/tag/${{ github.ref_name }}"
